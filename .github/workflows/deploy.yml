name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true      # 저장소에 Pages 가 꺼져 있으면 자동으로 켜줌

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # 저장소 루트가 곧 사이트 (index.html 이 여기에 있음)

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
